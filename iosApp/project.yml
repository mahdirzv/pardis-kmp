# XcodeGen spec for the Pardis iOS app.
# The .xcodeproj is gitignored / not committed; CI (and devs) run `xcodegen generate` in iosApp/
# to produce iosApp.xcodeproj reproducibly. The KMP Shared.framework is built by Gradle via the
# embedAndSignAppleFrameworkForXcode pre-build script and linked from FRAMEWORK_SEARCH_PATHS.
name: iosApp
options:
  bundleIdPrefix: app.pardis
  deploymentTarget:
    iOS: "17.0"            # uses @Observable + .navigationDestination(item:) (iOS 17)
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
          - "Fonts"
      # Brand fonts — declared explicitly as resources so they're guaranteed in the app bundle
      # (registered at launch by PardisFontRegistry), not left to source-glob auto-detection.
      - path: iosApp/Fonts
        buildPhase: resources
      # Generated design-system tokens (PardisColors/PardisSpacing/PardisRadius) live outside iosApp/.
      - path: ../design-system/generated/ios/PardisTokens.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pardis.reader
        PRODUCT_NAME: iosApp
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Allow the Gradle pre-build script to write the framework (Xcode 15+ sandboxes scripts by default).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      # Keep the (gitignored) .xcodeproj in sync with this spec. If project.yml changed
      # since the last generate, regenerate so additions like font resources aren't missed.
      # NOTE: the regenerated project applies to the NEXT build (Xcode has the current one
      # loaded), so a project.yml change needs one extra build — far better than silently
      # shipping a stale bundle.
      - name: "Regenerate project from project.yml (if stale)"
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "warning: xcodegen not found — skipping project regeneration (install via 'brew install xcodegen')"
            exit 0
          fi
          PBXPROJ="$SRCROOT/iosApp.xcodeproj/project.pbxproj"
          if [ ! -f "$PBXPROJ" ] || [ "$SRCROOT/project.yml" -nt "$PBXPROJ" ]; then
            echo "project.yml is newer than the project — regenerating with xcodegen"
            (cd "$SRCROOT" && xcodegen generate)
          fi
      - name: "Build KMP Shared.framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pardis.reader.uitests
        TEST_TARGET_NAME: iosApp

# Explicit scheme so `xcodebuild test -scheme iosApp` runs the UI-test tour.
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    test:
      targets:
        - iosAppUITests

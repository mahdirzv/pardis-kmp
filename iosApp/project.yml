# XcodeGen spec for the Pardis iOS app.
# The .xcodeproj is gitignored / not committed; CI (and devs) run `xcodegen generate` in iosApp/
# to produce iosApp.xcodeproj reproducibly. The KMP Shared.framework is built by Gradle via the
# embedAndSignAppleFrameworkForXcode pre-build script and linked from FRAMEWORK_SEARCH_PATHS.
name: iosApp
options:
  bundleIdPrefix: app.pardis
  deploymentTarget:
    iOS: "17.0"            # uses @Observable + .navigationDestination(item:) (iOS 17)
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
      # Generated design-system tokens (PardisColors/PardisSpacing/PardisRadius) live outside iosApp/.
      - path: ../design-system/generated/ios/PardisTokens.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pardis.reader
        PRODUCT_NAME: iosApp
        INFOPLIST_FILE: iosApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Allow the Gradle pre-build script to write the framework (Xcode 15+ sandboxes scripts by default).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build KMP Shared.framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pardis.reader.uitests
        TEST_TARGET_NAME: iosApp

# Explicit scheme so `xcodebuild test -scheme iosApp` runs the UI-test tour.
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    test:
      targets:
        - iosAppUITests

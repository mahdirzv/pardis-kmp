name: iOS Screenshots

# The UI-test screenshot tour is slow (~15–20 min: builds the app + test target, boots a
# simulator, runs the tour). It's kept OUT of the fast per-push kmp-build / ios-app gate (~3 min)
# and run on-demand instead:
#   gh workflow run ios-screenshots.yml --ref <branch>
# Also runs on PRs to main so reviewers get visual diffs.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Cache the Kotlin/Native toolchain + platform libs (not covered by the Gradle cache).
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Install tools
        run: brew install xcodegen chargepoint/xcparse/xcparse
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: UI-test tour (per-screen screenshots)
        run: |
          set -uo pipefail
          # First available iPhone simulator (robust to runner OS/device churn).
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in d for x in d[rt] if 'iPhone' in x['name']))")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Single build via `test` (no separate build step) — ScreenshotTests navigates each
          # screen and saves a screenshot attachment. `|| true`: artifact upload happens regardless.
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$UDID" \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO || true
      - name: Extract screenshots from .xcresult
        if: always()
        run: |
          mkdir -p screenshots
          xcparse screenshots build/result.xcresult screenshots/ || true
          ls -la screenshots/ || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: warn

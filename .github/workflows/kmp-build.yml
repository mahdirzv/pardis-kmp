name: KMP Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Run JS actions on Node 24 (Node 20 is being removed from runners). Belt-and-suspenders alongside
# the v5 action bumps below, and covers setup-gradle which has no Node-24 v4 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug
        run: ./gradlew :PardisAndroidApp:assembleDebug --no-daemon
      # Add tests here once a test suite exists: ./gradlew test --no-daemon

  ios-framework:
    # Kotlin/Native iOS targets require a macOS host.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Link shared iOS framework (simulator)
        # Real iOS-side check: links the Kotlin/Native Shared.framework, catching iosMain build
        # breaks. Building the SwiftUI app itself (xcodebuild) is NOT done here because the Xcode
        # project (iosApp/iosApp.xcodeproj) is gitignored and not committed to the repo. To build
        # the app in CI we'd need a committed/generated project (e.g. XcodeGen project.yml).
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon

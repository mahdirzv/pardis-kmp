name: KMP Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # On-demand: `gh workflow run kmp-build.yml --ref <branch>` (works once this file is on main).
  workflow_dispatch:

# Run JS actions on Node 24 (Node 20 is being removed from runners). Belt-and-suspenders alongside
# the v5 action bumps below, and covers setup-gradle which has no Node-24 v4 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug
        run: ./gradlew :PardisAndroidApp:assembleDebug --no-daemon
      # Add tests here once a test suite exists: ./gradlew test --no-daemon

  ios-framework:
    # Kotlin/Native iOS targets require a macOS host.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Link shared iOS framework (simulator)
        # Fast iOS-side check: links the Kotlin/Native Shared.framework, catching iosMain build breaks.
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon

  ios-app:
    # Full SwiftUI app build. The .xcodeproj is gitignored, so we generate it from iosApp/project.yml
    # (XcodeGen) and xcodebuild it for the simulator with no code signing. The KMP framework is built
    # by the project's embedAndSignAppleFrameworkForXcode pre-build script.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate
      - name: Build iOS app (simulator, no signing)
        run: |
          # Build a single concrete simulator arch: a generic destination yields ARCHS="arm64 x86_64"
          # + CURRENT_ARCH=undefined_arch, which embedAndSignAppleFrameworkForXcode can't resolve.
          # -derivedDataPath so the next step knows where the built .app is.
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: UI-test tour (per-screen screenshots)
        run: |
          set -uo pipefail
          # Pick the first available iPhone simulator (robust to runner OS/device churn).
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in d for x in d[rt] if 'iPhone' in x['name']))")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Runs ScreenshotTests, which navigates each screen and saves a screenshot attachment.
          # `|| true`: screenshots are best-effort; the separate build step above is the compile gate.
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath build \
            -resultBundlePath build/result.xcresult \
            CODE_SIGNING_ALLOWED=NO || true
      - name: Extract screenshots from .xcresult
        if: always()
        run: |
          brew install chargepoint/xcparse/xcparse
          mkdir -p screenshots
          xcparse screenshots build/result.xcresult screenshots/ || true
          ls -la screenshots/ || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
          if-no-files-found: warn

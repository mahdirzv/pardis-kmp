name: KMP Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug
        run: ./gradlew :PardisAndroidApp:assembleDebug --no-daemon
      # Add test when available: ./gradlew test

  # iOS job would require macos-latest + xcode setup for full framework + build
  # For now, Android validates shared logic + native shell.
  # TODO Phase 3+: add iOS job with setup-xcode etc.
